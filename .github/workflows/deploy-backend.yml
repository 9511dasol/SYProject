name: Deploy backend to NCP

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.NCP_REGISTRY }}/back-api
  DEPLOY_DIR: /opt/back-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 임시 진단 단계 — 로그인 실패 원인 확인 후 제거할 것
      - name: Debug registry response
        run: |
          echo "--- GET /v2/ (unauthenticated) ---"
          curl -v "https://${{ vars.NCP_REGISTRY }}/v2/" 2>&1 || true
          echo "--- docker login (verbose via trace) ---"
          echo "${{ secrets.NCP_SECRET_KEY }}" | docker login "${{ vars.NCP_REGISTRY }}" -u "${{ secrets.NCP_ACCESS_KEY }}" --password-stdin || true

      - name: Log in to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NCP_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 마이그레이션이 실패하면 여기서 멈추고 배포 단계로 넘어가지 않는다.
      # back/cloudbuild.yaml과 같은 순서: 빌드 → 푸시 → 마이그레이션 → 배포.
      # 방금 푸시한 그 이미지를 그대로 실행하므로 코드와 마이그레이션 버전이 항상 일치한다.
      - name: Run DB migration
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            /app/.venv/bin/python scripts/migrate.py upgrade

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.NCP_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.NCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to VM
        run: |
          scp -i ~/.ssh/deploy_key back/docker-compose.yml \
            "${{ secrets.NCP_VM_USER }}@${{ secrets.NCP_VM_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml"

      # VM의 docker daemon은 사전에 `docker login`이 돼 있어야 한다(1회성 설정) —
      # 매 배포마다 레지스트리 비밀값을 SSH 명령으로 다시 보내지 않기 위함.
      - name: Deploy on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.NCP_VM_USER }}@${{ secrets.NCP_VM_HOST }}" \
            "IMAGE='${{ env.IMAGE_NAME }}:${{ github.sha }}' DEPLOY_DIR='${{ env.DEPLOY_DIR }}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          export IMAGE
          docker compose pull
          docker compose up -d
          docker image prune -f

          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "헬스체크 통과"
              exit 0
            fi
            sleep 3
          done
          echo "헬스체크 실패 — 최근 로그:"
          docker compose logs --tail=50
          exit 1
          EOF

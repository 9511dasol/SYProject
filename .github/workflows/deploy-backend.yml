name: Deploy backend to NCP

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/back-api
  REPO_DIR: /opt/back-api/src
  REPO_URL: https://github.com/9511dasol/SYProject.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.NCP_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.NCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to VM
        run: |
          scp -i ~/.ssh/deploy_key back/docker-compose.yml \
            "${{ secrets.NCP_VM_USER }}@${{ secrets.NCP_VM_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml"

      # 레지스트리를 거치지 않고 VM에서 직접 git pull + docker build.
      # 서버가 1대뿐이라 빌드→푸시→pull 왕복이 불필요하고, NCP Container Registry
      # 인증 문제(원인 미상)도 피해간다. 마이그레이션은 방금 빌드한 이미지로 실행해
      # 코드와 버전이 항상 일치하고, 실패하면 여기서 멈춰 배포로 넘어가지 않는다.
      - name: Build, migrate, and deploy on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.NCP_VM_USER }}@${{ secrets.NCP_VM_HOST }}" \
            "DEPLOY_DIR='${{ env.DEPLOY_DIR }}' REPO_DIR='${{ env.REPO_DIR }}' REPO_URL='${{ env.REPO_URL }}' SHA='${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone "$REPO_URL" "$REPO_DIR"
          fi
          cd "$REPO_DIR"
          git fetch origin main
          git checkout "$SHA"

          IMAGE="back-api:$SHA"
          docker build -t "$IMAGE" -t back-api:latest "$REPO_DIR/back"

          echo "--- 마이그레이션 ---"
          docker run --rm --env-file "$DEPLOY_DIR/app.env" "$IMAGE" \
            /app/.venv/bin/python scripts/migrate.py upgrade

          cd "$DEPLOY_DIR"
          export IMAGE
          docker compose up -d
          docker image prune -f

          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "헬스체크 통과"
              exit 0
            fi
            sleep 3
          done
          echo "헬스체크 실패 — 최근 로그:"
          docker compose logs --tail=50
          exit 1
          EOF

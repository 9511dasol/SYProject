# Alembic config for DB schema versioning.
# The DB URL is NOT hardcoded here; migrations/env.py injects it from
# app.core.settings.settings.DATABASE_URL so .env stays the single source of truth.
# NOTE: keep this file ASCII-only (configparser reads it with the system locale
# encoding, which is not UTF-8 on Windows).

[alembic]
script_location = migrations
prepend_sys_path = .
# migration filename: <timestamp>_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# auto-format newly generated migration files with ruff (optional)
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

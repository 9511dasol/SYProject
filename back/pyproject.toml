[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi-pagination>=0.15.13",
    "fastapi[standard]>=0.136.3",
    "openai>=2.38.0",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "apscheduler>=3.10",
    "resend>=2.30.1",
    "pillow>=12.2.0",
    "anthropic>=0.107.1",
    "langgraph>=1.2.4",
    "pgvector>=0.4.2",
    "google-genai>=2.8.0",
    "pydantic-settings>=2.7.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    # pandas/openpyxl 등 서드파티의 DeprecationWarning은 소음이라 무시
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/services/llm/*",
    "app/services/mail/*",
    "migrations/*",
]

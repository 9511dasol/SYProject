[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi-pagination>=0.15.13",
    "fastapi[standard]>=0.136.3",
    "openai>=2.38.0",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # 대행사 주간 리포트가 .xlsb(바이너리 엑셀)로 온다 — openpyxl 은 이 포맷을 열지 못한다.
    # calamine 은 xlsx/xlsm/xlsb 를 모두 읽고, 같은 파일(57만 행)에서 순수 파이썬
    # 리더(pyxlsb)보다 16배 빠르다 — 49.2초 → 3.0초.
    "python-calamine>=0.9.1",
    "apscheduler>=3.10",
    "resend>=2.30.1",
    "pillow>=12.2.0",
    "anthropic>=0.107.1",
    "langgraph>=1.2.4",
    "pgvector>=0.4.2",
    "google-genai>=2.8.0",
    "pydantic-settings>=2.7.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# async def 테스트를 마커 없이 그대로 실행한다 (업로드 검증 헬퍼가 async)
asyncio_mode = "auto"
filterwarnings = [
    # pandas/openpyxl 등 서드파티의 DeprecationWarning은 소음이라 무시
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/services/llm/*",
    "app/services/mail/*",
    "migrations/*",
]

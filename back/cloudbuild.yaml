steps:
  # report_template.xlsx는 back/app/assets/ 에 있고 git으로 함께 배포된다.
  # (예전에는 86MB짜리를 GCS에서 내려받았지만, 최신 한 기간만 담은 673KB로 줄여 저장소에 넣었다)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA
      - .
    dir: back

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA

  # DB 마이그레이션 — 반드시 배포보다 먼저. 여기서 실패하면 빌드가 멈추고
  # 새 리비전이 나가지 않는다. 앱 기동 중에 돌리면 같은 실패가 Cloud Run에는
  # "컨테이너가 PORT에서 리슨하지 못했다"로만 보여 원인이 드러나지 않는다.
  # 방금 빌드한 이미지를 그대로 실행하므로 코드와 마이그레이션 버전이 항상 일치한다.
  - name: 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA'
    entrypoint: /app/.venv/bin/python
    args: ['/app/scripts/migrate.py', 'upgrade']
    secretEnv: ['DATABASE_URL']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - back-api
      - --image=asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA
      - --region=asia-northeast3
      - --quiet

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA

# 마이그레이션 단계에만 쓰인다. Cloud Build 서비스 계정에 이 시크릿의
# roles/secretmanager.secretAccessor 권한이 있어야 한다.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

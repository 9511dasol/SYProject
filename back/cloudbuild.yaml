steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA
      - .
    dir: back

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - back-api
      - --image=asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA
      - --region=asia-northeast3
      - --quiet

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/back-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
